<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Expense Tracker</h1>


        <!-- ================================ -->
        <!-- DASHBOARD -->
        <!-- ================================ -->

        <h2>Dashboard</h2>

        <div class="dashboard">

            <div class="card">
                <h3>Total Expenses</h3>
                <p>₹<span id="dashboardTotal">0</span></p>
            </div>

            <div class="card">
                <h3>Today's Expenses</h3>
                <p>₹<span id="todayTotal">0</span></p>
            </div>

            <div class="card">
                <h3>This Month</h3>
                <p>₹<span id="monthTotal">0</span></p>
            </div>

            <div class="card">
                <h3>Number of Expenses</h3>
                <p><span id="expenseCount">0</span></p>
            </div>

        </div>


        <!-- ================================ -->
        <!-- CATEGORY SUMMARY -->
        <!-- ================================ -->

        <h2>Category Summary</h2>

        <div id="categorySummary"></div>

        <h2>Expense Chart</h2>

<div class="chart-container">
    <canvas id="expenseChart"></canvas>
</div>



        <!-- ================================ -->
        <!-- ADD / EDIT EXPENSE -->
        <!-- ================================ -->

        <h2>Add Expense</h2>

        <form id="expenseForm">

            <input
                type="number"
                id="amount"
                placeholder="Amount"
                required
            >

            <select id="category" required>

                <option value="">
                    Select Category
                </option>

                <option value="Food">
                    Food
                </option>

                <option value="Transport">
                    Transport
                </option>

                <option value="Shopping">
                    Shopping
                </option>

                <option value="Bills">
                    Bills
                </option>

                <option value="Entertainment">
                    Entertainment
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

            <input
                type="text"
                id="description"
                placeholder="Description"
            >

            <input
                type="date"
                id="date"
                required
            >

            <button type="submit">
                Add Expense
            </button>

        </form>


        <!-- ================================ -->
        <!-- FILTERS -->
        <!-- ================================ -->

        <h2>Filter Expenses</h2>

        <input
            type="text"
            id="search"
            placeholder="Search by description..."
        >

        <select id="filterCategory">

            <option value="">
                All Categories
            </option>

            <option value="Food">
                Food
            </option>

            <option value="Transport">
                Transport
            </option>

            <option value="Shopping">
                Shopping
            </option>

            <option value="Bills">
                Bills
            </option>

            <option value="Entertainment">
                Entertainment
            </option>

            <option value="Other">
                Other
            </option>

        </select>

        <label for="filterDate">
            Filter by Date:
        </label>

        <input
            type="date"
            id="filterDate"
        >

        <button
            type="button"
            id="clearFilters"
        >
            Clear Filters
        </button>


        <!-- ================================ -->
        <!-- EXPENSE LIST -->
        <!-- ================================ -->

        <h2>Expenses</h2>

        <div id="expenseList"></div>

        <h2>
            Filtered Total: ₹<span id="total">0</span>
        </h2>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>


</body>

</html>
